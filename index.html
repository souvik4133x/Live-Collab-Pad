<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Collab Pad</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <!-- Custom CSS for Styling (No Tailwind) -->
    <style>
        :root {
            --dark-bg: #111827;
            --primary-bg: #1f2937;
            --secondary-bg: #374151;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-purple: #8b5cf6;
            --accent-purple-hover: #7c3aed;
            --accent-pink: #ec4899;
            --accent-pink-hover: #db2777;
            --status-green: #22c55e;
            --status-yellow: #eab308;
            --status-red: #ef4444;
            --border-color: #4b5563;
        }

        /* Basic Reset & Body Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        #root {
            width: 100%;
            max-width: 900px; /* 4xl in tailwind */
        }
        
        /* Animation Keyframes */
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Header Styling */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2.75rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            margin-top: 0.5rem;
            color: var(--text-secondary);
        }
        
        /* Join Room Component */
        .join-room-container {
            background-color: var(--primary-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 500px;
            margin: 0 auto;
            animation: fade-in 0.5s ease-out forwards;
        }
        .join-room-container h2 {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .join-form {
            display: flex;
            gap: 0.75rem;
        }
        .join-form input {
            flex-grow: 1;
            background-color: var(--secondary-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .join-form input::placeholder {
            color: var(--text-secondary);
        }
        .join-form input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.4);
        }
        
        /* General Button Styling */
        .btn {
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-purple {
            background-color: var(--accent-purple);
            color: white;
        }
        .btn-purple:hover {
            background-color: var(--accent-purple-hover);
        }
        .btn-pink {
            background-color: var(--accent-pink);
            color: white;
            font-size: 0.875rem;
        }
        .btn-pink:hover {
            background-color: var(--accent-pink-hover);
        }
        .btn-gray {
             background-color: var(--secondary-bg);
             color: white;
             font-size: 0.875rem;
        }
        .btn-gray:hover {
            background-color: var(--border-color);
        }

        /* Editor Component */
        .editor-container {
            background-color: var(--primary-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: fade-in-up 0.5s ease-out forwards;
        }
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .editor-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }
        .editor-header h2 span {
            color: var(--accent-purple);
            font-weight: 700;
        }
        .editor-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .connection-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .status-dot.connected { background-color: var(--status-green); }
        .status-dot.connecting { background-color: var(--status-yellow); }
        .status-dot.disconnected { background-color: var(--status-red); }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .editor-textarea {
            width: 100%;
            height: 450px;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .editor-textarea:focus {
             border-color: var(--accent-purple);
             box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.4);
        }

        /* Footer Styling */
        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #6b7280; /* gray-500 */
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React Application Code -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Configuration ---
        const BACKEND_URL = 'http://localhost:8000'; // Added http:// protocol

        // --- Main App Component ---
        const App = () => {
            const [room, setRoom] = useState('');
            const [isInRoom, setIsInRoom] = useState(false);

            const handleJoin = (roomName) => {
                if (roomName.trim()) {
                    setRoom(roomName.trim());
                    setIsInRoom(true);
                }
            };

            const handleLeave = () => {
                setIsInRoom(false);
                setRoom('');
            };

            return (
                <main>
                    <Header />
                    {!isInRoom ? (
                        <JoinRoom onJoin={handleJoin} />
                    ) : (
                        <Editor room={room} onLeave={handleLeave} />
                    )}
                    <Footer />
                </main>
            );
        };

        // --- Header Component ---
        const Header = () => (
            <header className="header">
                <h1>Live Collab Pad</h1>
                <p>Real-time document collaboration. No sign-up required.</p>
            </header>
        );

        // --- JoinRoom Component ---
        const JoinRoom = ({ onJoin }) => {
            const [roomInput, setRoomInput] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                onJoin(roomInput);
            };

            return (
                <div className="join-room-container">
                    <h2>Join or Create a Room</h2>
                    <form onSubmit={handleSubmit} className="join-form">
                        <input
                            type="text"
                            value={roomInput}
                            onChange={(e) => setRoomInput(e.target.value)}
                            placeholder="Enter room name..."
                            autoFocus
                        />
                        <button type="submit" className="btn btn-purple">Join</button>
                    </form>
                </div>
            );
        };
        
        // --- Editor Component ---
        const Editor = ({ room, onLeave }) => {
            const [content, setContent] = useState('');
            const [status, setStatus] = useState('Connecting...');
            const ws = useRef(null);

            useEffect(() => {
                if (!room) return;

                ws.current = new WebSocket(`ws://localhost:8000/ws/${room}`); // Fixed WebSocket URL
                ws.current.onopen = () => setStatus('Connected');
                ws.current.onmessage = (event) => setContent(event.data);
                ws.current.onclose = () => setStatus('Disconnected');
                ws.current.onerror = () => setStatus('Connection Error');

                return () => {
                    if (ws.current) ws.current.close();
                };
            }, [room]);

            const handleContentChange = (e) => {
                const newContent = e.target.value;
                setContent(newContent);
                if (ws.current && ws.current.readyState === WebSocket.OPEN) {
                    ws.current.send(newContent);
                }
            };

            const handleDownload = async () => {
                try {
                    const response = await fetch(`${BACKEND_URL}/download/${room}`);
                    const data = await response.json();
                    
                    // Convert base64 to blob
                    const pdfData = atob(data.pdf_data);
                    const pdfArray = new Uint8Array(pdfData.length);
                    for (let i = 0; i < pdfData.length; i++) {
                        pdfArray[i] = pdfData.charCodeAt(i);
                    }
                    const pdfBlob = new Blob([pdfArray], { type: 'application/pdf' });
                    
                    // Create download link
                    const downloadUrl = window.URL.createObjectURL(pdfBlob);
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = data.filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(downloadUrl);
                } catch (error) {
                    console.error("Download failed:", error);
                    alert(`Failed to download PDF: ${error.message}`);
                }
            };

            const getStatusClass = () => {
                if (status === 'Connected') return 'connected';
                if (status === 'Connecting...') return 'connecting';
                return 'disconnected';
            };

            return (
                <div className="editor-container">
                    <div className="editor-header">
                        <h2>Room: <span>{room}</span></h2>
                        <div className="editor-controls">
                            <div className="connection-indicator">
                                <div className={`status-dot ${getStatusClass()}`}></div>
                                <span className="status-text">{status}</span>
                            </div>
                            <button onClick={onLeave} className="btn btn-gray">Leave</button>
                            <button onClick={handleDownload} className="btn btn-pink">Download PDF</button>
                        </div>
                    </div>
                    <textarea
                        value={content}
                        onChange={handleContentChange}
                        className="editor-textarea"
                        placeholder="Start typing..."
                        autoFocus
                    ></textarea>
                </div>
            );
        };

        // --- Footer Component ---
        const Footer = () => (
            <footer className="footer">
                <p>Built with FastAPI & React.</p>
            </footer>
        );

        // --- Render the App ---
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
